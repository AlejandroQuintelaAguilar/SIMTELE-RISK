services:
  db:
    image: postgres:16-alpine
    container_name: simtele_risk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simtele_pass}
      POSTGRES_DB: ${POSTGRES_DB:-simtele_risk}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - simtele_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-simtele_risk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: simtele_risk_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-simtele_pass}@db:5432/${POSTGRES_DB:-simtele_risk}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: simtele_risk_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  simtele_pgdata:
